<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LUMA — Profil Utilisateur | Lumesys</title>
  <meta name="description" content="Gestion du profil utilisateur et statut de présence LUMA">
  
  <link rel="icon" type="image/svg+xml" href="./public/icon.svg">
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#0f766e">
  
  <link rel="stylesheet" href="./css/style.css">
</head>
<body class="h-full bg-slate-50 flex flex-col justify-between">

  <!-- En-tête -->
  <header class="bg-white border-b border-slate-200">
    <div class="max-w-3xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <a href="./chat.html" class="flex items-center gap-2 text-xs font-semibold text-teal-700 hover:text-teal-800 transition-colors">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
          </svg>
          Retour aux messages
        </a>
      </div>
      <div class="text-xs font-bold text-slate-800">
        Profil Lumesys
      </div>
    </div>
  </header>

  <!-- Contenu Principal -->
  <main class="flex-1 max-w-xl mx-auto w-full px-4 py-8">
    <div class="bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden animate-fade-in">
      
      <!-- Bannière & Avatar -->
      <div class="bg-gradient-to-r from-teal-700 to-teal-800 h-28 px-6 relative flex items-end">
        <div class="absolute -bottom-10 left-6">
          <div id="profile-avatar-box" class="w-20 h-20 rounded-full border-4 border-white bg-teal-800 text-white font-black text-2xl flex items-center justify-center shadow-md">
            U
          </div>
        </div>
      </div>

      <div class="pt-14 p-6">
        
        <div id="profile-success-msg" class="hidden mb-4 p-3 bg-emerald-50 border border-emerald-200 text-emerald-800 text-xs rounded-xl text-center font-medium">
          Profil mis à jour avec succès dans l'écosystème Lumesys !
        </div>

        <form id="profile-form" class="space-y-4">
          
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Nom d'affichage</label>
            <input id="profile-nom" type="text" class="w-full text-xs p-2.5 bg-slate-50 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-teal-600 focus:bg-white" required>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Statut de présence</label>
            <select id="profile-statut" class="w-full text-xs p-2.5 bg-slate-50 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-teal-600 focus:bg-white">
              <option value="online">🟢 En ligne (Disponible)</option>
              <option value="away">🟡 Absent</option>
              <option value="offline">⚪ Hors ligne</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Biographie / Rôle dans Lumesys</label>
            <textarea id="profile-bio" rows="3" placeholder="Présentez brièvement votre rôle ou statut..." class="w-full text-xs p-2.5 bg-slate-50 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-teal-600 focus:bg-white resize-none"></textarea>
          </div>

          <!-- Champs en lecture seule de l'écosystème Lumesys -->
          <div class="pt-3 border-t border-slate-100 space-y-3">
            <div>
              <label class="block text-[11px] font-semibold text-slate-400 mb-1">Adresse email Lumesys (Identité certifiée)</label>
              <input id="profile-email" type="text" class="w-full text-xs p-2.5 bg-slate-100 text-slate-500 border border-slate-200 rounded-lg cursor-not-allowed" readonly>
            </div>

            <div>
              <label class="block text-[11px] font-semibold text-slate-400 mb-1">Identifiant Firebase (UID)</label>
              <input id="profile-uid" type="text" class="w-full text-xs font-mono p-2.5 bg-slate-100 text-slate-500 border border-slate-200 rounded-lg cursor-not-allowed" readonly>
            </div>
          </div>

          <div class="pt-4 flex items-center justify-between">
            <button type="button" id="btn-logout" class="px-4 py-2 text-xs font-semibold text-rose-600 hover:bg-rose-50 rounded-lg transition-colors">
              Déconnexion
            </button>
            <button type="submit" class="px-5 py-2 bg-teal-700 hover:bg-teal-800 text-white text-xs font-semibold rounded-lg shadow-2xs transition-colors">
              Enregistrer les modifications
            </button>
          </div>

        </form>
      </div>

    </div>
  </main>

  <footer class="py-4 text-center text-xs text-slate-400">
    LUMA — Écosystème Lumesys
  </footer>

  <script type="module">
    import { AuthService } from './js/auth.js';
    import { Database } from './js/database.js';
    import { UsersService } from './js/users.js';

    let currentUser = null;
    let currentProfile = null;

    AuthService.init(async (user, profile) => {
      currentUser = user;
      currentProfile = profile;

      if (!user) {
        window.location.href = './login.html';
        return;
      }

      // Remplissage des champs
      const nomInput = document.getElementById('profile-nom');
      const emailInput = document.getElementById('profile-email');
      const uidInput = document.getElementById('profile-uid');
      const bioInput = document.getElementById('profile-bio');
      const statutSelect = document.getElementById('profile-statut');
      const avatarBox = document.getElementById('profile-avatar-box');

      const name = profile?.nom || user.displayName || user.email || 'Utilisateur';
      nomInput.value = name;
      emailInput.value = user.email || '';
      uidInput.value = user.uid;
      bioInput.value = profile?.bio || '';
      statutSelect.value = profile?.statut || 'online';

      const avatarProps = UsersService.getAvatarProps(name, user.email);
      if (profile?.photoUrl || user.photoURL) {
        avatarBox.innerHTML = `<img src="${profile?.photoUrl || user.photoURL}" alt="${name}" class="w-full h-full object-cover rounded-full">`;
      } else {
        avatarBox.textContent = avatarProps.initials;
        avatarBox.style.backgroundColor = avatarProps.bgColor;
      }
    });

    // Sauvegarde
    document.getElementById('profile-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!currentUser) return;

      const nom = document.getElementById('profile-nom').value.trim();
      const bio = document.getElementById('profile-bio').value.trim();
      const statut = document.getElementById('profile-statut').value;

      try {
        await Database.enregistrerOuMettreAJourUtilisateur({
          uid: currentUser.uid,
          nom,
          bio,
          statut,
        });

        const successMsg = document.getElementById('profile-success-msg');
        successMsg.classList.remove('hidden');
        setTimeout(() => successMsg.classList.add('hidden'), 3500);
      } catch (err) {
        alert('Erreur lors de la mise à jour du profil : ' + err.message);
      }
    });

    // Déconnexion
    document.getElementById('btn-logout').addEventListener('click', async () => {
      await AuthService.deconnexion();
      window.location.href = './login.html';
    });
  </script>
</body>
</html>
